<meta name="theme-color" content="#0C0C0C" media="(prefers-color-scheme: dark)">

  /* Full-screen on a phone: keep the header clear of the clock and notch */

<body>
<title>Tandem Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one-screen chat. Hairline header, plain transcript, quiet composer.
   Ink bubbles for you, soft grey for the tutor; colour is reserved for corrections. */
:root {
  --bg: #FFFFFF;
  --soft: #F4F4F2;
  --ink: #111111;
  --muted: #74746F;
  --line: #E8E8E5;
  --del: #D92D20;
  --del-wash: #FDECEA;
  --ins: #0A8A55;
  --ins-wash: #E3F6EC;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C0C; --soft: #1A1A1A; --ink: #EDEDEA; --muted: #8F8F8A; --line: #262626;
    --del: #FF6B5E; --del-wash: #2B1513; --ins: #3DD68C; --ins-wash: #0F2A1E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0C; --soft: #1A1A1A; --ink: #EDEDEA; --muted: #8F8F8A; --line: #262626;
  --del: #FF6B5E; --del-wash: #2B1513; --ins: #3DD68C; --ins-wash: #0F2A1E;
  color-scheme: dark;
}

/* Per-language accent: German amber, French cobalt (set by data-lang on the root) */
:root, :root[data-lang="de"] { --accent: #B4580A; }
:root[data-lang="fr"] { --accent: #3552D6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]), :root[data-lang="de"]:not([data-theme="light"]) { --accent: #F0A04B; }
  :root[data-lang="fr"]:not([data-theme="light"]) { --accent: #8FA3FF; }
}
:root[data-theme="dark"], :root[data-theme="dark"][data-lang="de"] { --accent: #F0A04B; }
:root[data-theme="dark"][data-lang="fr"] { --accent: #8FA3FF; }
:root { --accent-wash: color-mix(in srgb, var(--accent) 12%, var(--bg)); }

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font); letter-spacing: -0.005em;
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, select, textarea, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header { flex: none; border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 16px; }
.bar { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 6px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.03em; margin-right: auto; border: 0; background: transparent; padding: 4px 6px 4px 0; border-radius: 8px; }
.brand:hover { color: var(--accent); }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; }
.seg button {
  border: 0; background: transparent; border-radius: 7px; padding: 5px 10px;
  font: 500 13px/1 var(--mono); color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--accent); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.level {
  border: 0; background: var(--soft); border-radius: 10px; height: 32px; padding: 0 6px;
  font: 500 13px/1 var(--mono);
}
.icon-btn {
  position: relative; width: 34px; height: 34px; border: 0; background: transparent; border-radius: 10px;
  display: grid; place-items: center; color: var(--ink);
}
.icon-btn:hover { background: var(--soft); }
.icon-btn:disabled { opacity: 0.3; cursor: default; background: transparent; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn[aria-expanded="true"], .icon-btn.on { background: var(--ink); color: var(--bg); }
.icon-btn.armed { background: var(--del); color: #FFFFFF; }
.badge {
  position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--del); box-shadow: 0 0 0 2px var(--bg);
}
.confirm {
  max-width: 680px; margin: 10px auto 0; display: flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 500; background: var(--soft); border-radius: 14px; padding: 8px 8px 8px 14px;
}
.confirm span { flex: 1; min-width: 0; }
.confirm button { flex: none; border: 0; border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; background: var(--bg); }
.confirm .yes { background: var(--ink); color: var(--bg); }
.continue { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 12px 20px; width: 100%; font-size: 15px; font-weight: 600; }

/* Transcript */
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.log { max-width: 680px; margin: 0 auto; padding-block: 20px 28px; padding-inline: 16px; display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row.me { align-items: flex-end; }
.row.tutor { align-items: flex-start; }
.who { font-size: 12px; font-weight: 600; color: var(--accent); }
.bubble { max-width: 85%; min-width: 0; padding: 10px 14px; border-radius: 20px; overflow-wrap: anywhere; }
.me .bubble { background: var(--ink); color: var(--bg); border-bottom-right-radius: 6px; }
.me .bubble.meta { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.tutor .bubble { background: var(--soft); border-bottom-left-radius: 6px; font-family: var(--serif); font-size: 17px; line-height: 1.55; letter-spacing: 0; }
.bubble p { margin: 0; }
.bubble p + p { margin-top: 8px; }
.bubble strong { font-weight: 600; }
.thinking { display: inline-flex; gap: 4px; align-items: center; height: 1.5em; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: 0.4; }
@media (prefers-reduced-motion: no-preference) {
  .thinking i { animation: pulse 1.2s infinite ease-in-out; }
  .thinking i:nth-child(2) { animation-delay: 0.15s; }
  .thinking i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 40% { opacity: 1; } }
}

/* Correction: an inline edit of what you wrote */
.fix { max-width: 85%; min-width: 0; align-self: flex-end; display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 0; }
.diff { font-family: var(--serif); font-size: 17px; line-height: 1.6; letter-spacing: 0; overflow-wrap: anywhere; }
.diff del { color: var(--del); background: var(--del-wash); text-decoration-thickness: 1.5px; border-radius: 4px; padding: 0 3px; }
.diff ins { color: var(--ins); background: var(--ins-wash); text-decoration: none; font-weight: 600; border-radius: 4px; padding: 0 3px; }
.notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--muted); }
.notes li { padding-left: 14px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--del); }
.notes li.tip::before { background: var(--ins); }
.why { align-self: flex-start; border: 0; background: transparent; padding: 0; color: var(--accent); font-size: 13px; font-weight: 600; }
.ok { align-self: flex-end; font-size: 13px; font-weight: 600; color: var(--ins); display: inline-flex; align-items: center; gap: 5px; }
.ok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ins); }

.vocab { max-width: 85%; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.vocab b { color: var(--accent); font-weight: 600; }
.tools { display: flex; gap: 14px; }
.link { border: 0; background: transparent; padding: 0; font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.link:hover { color: var(--ink); }
.link svg { width: 14px; height: 14px; }
.translation { max-width: 85%; font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--line); }
.error { align-self: center; font-size: 13px; color: var(--del); text-align: center; max-width: 34ch; }
.scene { align-self: center; font: 500 12px/1 var(--mono); color: var(--muted); text-transform: lowercase; }

/* Welcome */
.welcome { display: flex; flex-direction: column; gap: 28px; padding-top: 12px; }
.hero h1 { margin: 0; font-family: var(--serif); font-size: clamp(32px, 9vw, 44px); line-height: 1.08; font-weight: 500; letter-spacing: -0.025em; text-wrap: balance; }
.hero h1 span { color: var(--accent); }
.hero p { margin: 12px 0 0; color: var(--muted); max-width: 40ch; }
.label { font: 500 12px/1 var(--mono); color: var(--muted); text-transform: lowercase; margin-bottom: 10px; }
.preview { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); border-color: var(--accent); }
.primary {
  border: 0; border-radius: 999px; padding: 14px 22px; width: 100%;
  background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600;
}
.primary:disabled { opacity: 0.35; cursor: default; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

/* Composer */
footer { flex: none; padding-block: 8px calc(12px + env(safe-area-inset-bottom, 0px)); padding-inline: 16px; }
.composer { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.keys { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.keys::-webkit-scrollbar { display: none; }
.keys button { flex: none; min-width: 32px; height: 30px; border: 0; background: transparent; border-radius: 8px; padding: 0 6px; font-size: 16px; color: var(--muted); }
.keys button:hover { background: var(--soft); color: var(--ink); }
.inputrow {
  display: flex; gap: 6px; align-items: flex-end; background: var(--soft); border-radius: 24px; padding: 5px;
  border: 1px solid transparent;
}
.inputrow:focus-within { border-color: var(--accent); background: var(--bg); box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
textarea {
  flex: 1; min-width: 0; resize: none; max-height: 140px; border: 0; background: transparent;
  padding: 8px 6px 8px 12px; font-size: 16px; line-height: 1.4;
}
textarea:focus-visible { outline: none; }
.send { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.send.stop { background: var(--del); color: #FFFFFF; }
.send:disabled { opacity: 0.2; cursor: default; }
.send svg { width: 18px; height: 18px; }

/* Talking: hands-free switch and live mic */
.toprow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.toprow .keys { flex: 1; min-width: 0; }
.hf {
  flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px;
  font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
}
.hf::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.hf[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }
.hf[aria-pressed="true"]::before { background: var(--accent); }
.inputrow.live { border-color: var(--del); background: var(--bg); }
.send.live { background: var(--del); color: #FFFFFF; }
@media (prefers-reduced-motion: no-preference) {
  .send.live { animation: ring 1.4s infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--del) 45%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
}
.keyform { display: flex; flex-direction: column; gap: 8px; }
.keyform input { flex: 1; min-width: 0; border: 0; background: var(--soft); border-radius: 10px; padding: 9px 10px; font: 14px var(--mono); }
.hint a { color: var(--accent); }

/* Voice settings */
.panel { flex: none; border-bottom: 1px solid var(--line); padding-block: 14px; padding-inline: 16px; max-height: 55vh; overflow-y: auto; }
.panel-inner { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.panel-row { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 15px; }
.panel-row select { flex: 1; min-width: 0; font-size: 15px; padding: 8px; border-radius: 10px; border: 0; background: var(--soft); }
.panel-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.panel-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.panel .eyebrow { font: 500 12px/1 var(--mono); color: var(--muted); text-transform: lowercase; }
.ghost { border: 0; background: var(--soft); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 500; }

/* Mistakes */
.notebook { display: flex; flex-direction: column; gap: 4px; }
.nb-head { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
.nb-head h1 { margin: 0; font-family: var(--serif); font-size: 32px; line-height: 1.1; font-weight: 500; letter-spacing: -0.02em; }
.nb-head p { margin: 0; color: var(--muted); }
.nb-card { border-top: 1px solid var(--line); padding-block: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.nb-meta { display: flex; justify-content: space-between; align-items: center; font: 500 12px/1 var(--mono); color: var(--muted); }
</style>

<header>
  <div class="bar">
    <button id="home" class="brand" type="button" aria-label="Tandem, main menu">Tandem</button>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-de" data-lang="de" aria-pressed="true" aria-label="German">DE</button>
      <button id="lang-fr" data-lang="fr" aria-pressed="false" aria-label="French">FR</button>
    </div>
    <select id="level" class="level" aria-label="Your level">
      <option>A1</option><option selected>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option>
    </select>
    <button id="voice" class="icon-btn" type="button" aria-expanded="false" aria-controls="voice-panel" aria-label="Voice settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button id="nb" class="icon-btn" type="button" aria-label="Mistakes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
      <span class="badge" id="nb-count" hidden></span>
    </button>
    <button id="reset" class="icon-btn" type="button" aria-label="Start a new conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>
  <div class="confirm" id="reset-note" role="alert" hidden>
    <span>Start a new chat?</span>
    <button type="button" id="reset-cancel">Cancel</button>
    <button type="button" class="yes" id="reset-yes">New chat</button>
  </div>
</header>

<section id="voice-panel" class="panel" hidden></section>

<main id="scroller"><div class="log" id="log"></div></main>

<footer>
  <form class="composer" id="composer">
    <div class="toprow">
      <button class="hf" id="handsfree" type="button" aria-pressed="false" hidden>Hands-free</button>
      <div class="keys" id="keys" aria-label="Special characters"></div>
    </div>
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="Message" aria-label="Your message"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
  </form>
</footer>

<script>
// Inside Claude the page talks to Claude through the viewer's account; on its own site it uses an API key.
const IN_CLAUDE = !!window.claude;

const LANGS = {
  de: {
    name: "German", native: "Deutsch",
    greet: "Hallo! Ich möchte Deutsch üben.",
    placeholder: "Schreib auf Deutsch…",
    tutor: "Lena",
    perfect: "Perfekt – no mistakes",
    keys: ["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü", "„", "“"],
    example: {
      me: "Gestern ich habe ins Kino gegangen.",
      fixed: "Gestern bin ich ins Kino gegangen.",
      notes: ["After a time word like „gestern“, the verb comes second: „Gestern bin ich…“.", "„gehen“ shows movement, so the perfect tense uses „sein“, not „haben“."],
      reply: "Oh, schön! Welchen Film hast du gesehen?"
    }
  },
  fr: {
    name: "French", native: "Français",
    greet: "Bonjour ! Je voudrais pratiquer le français.",
    placeholder: "Écris en français…",
    tutor: "Camille",
    perfect: "Parfait – no mistakes",
    keys: ["é", "è", "ê", "à", "â", "ç", "ô", "î", "ù", "û", "œ", "ë", "«", "»"],
    example: {
      me: "Hier j'ai allé au cinéma avec mon amie.",
      fixed: "Hier, je suis allée au cinéma avec mon amie.",
      notes: ["« aller » takes « être » in the passé composé: « je suis allé(e) ».", "With « être », the past participle agrees with the subject (allée if you're female)."],
      reply: "Super ! Qu'est-ce que vous avez vu ?"
    }
  }
};

const MAX_TURNS = 40;
const MAX_NOTEBOOK = 200;

// Role-play scenes. `brief` goes to Claude; `label` is what the learner sees.
const SCENES = [
  { id: "free", icon: "💬", label: "Free chat", brief: "" },
  { id: "cafe", icon: "☕", label: "Café", brief: "Role-play: you are a friendly server at a café and the learner is a customer. Stay in character: take their order, answer questions about the menu, mention prices, bring the bill." },
  { id: "bakery", icon: "🥐", label: "Bakery", brief: "Role-play: you work at a bakery and the learner is buying bread and pastries. Stay in character: suggest items, give prices, count change." },
  { id: "directions", icon: "🗺️", label: "Directions", brief: "Role-play: you are a local on the street and the learner is a lost tourist. Stay in character and give directions with real landmarks." },
  { id: "hotel", icon: "🛎️", label: "Hotel", brief: "Role-play: you are a hotel receptionist and the learner is checking in. Stay in character: reservation, passport, breakfast times, wifi, a small problem with the room." },
  { id: "doctor", icon: "🩺", label: "Doctor", brief: "Role-play: you are a doctor and the learner is a patient describing symptoms. Stay in character, ask follow-up questions and give simple advice." },
  { id: "interview", icon: "💼", label: "Job interview", brief: "Role-play: you are interviewing the learner for a job they choose. Stay in character and ask typical interview questions one at a time." },
  { id: "smalltalk", icon: "🥂", label: "Small talk", brief: "Role-play: you have just met the learner at a party. Make small talk: where they're from, work, hobbies, plans." }
];

function reviewBrief(mistakes) {
  const list = mistakes.map(m => `- They wrote "${m.original}" → correct: "${m.fixed}"`).join("\n");
  return `Review drill instead of free conversation. These are mistakes the learner made recently:\n${list}\n\nRun a short drill, one item at a time: give the learner a NEW English sentence to translate into the target language that practises the same rule as one of these mistakes (never reuse their exact sentence). When they answer, correct it in the <fix> block as usual, add one encouraging sentence, then give the next sentence. After about six items, sum up which rules they have mastered and which to keep practising. Your first reply: say hello, explain the drill in one sentence, and give the first sentence.`;
}

function rules(L, level, scene) {
  return `You are a warm, patient ${L.name} conversation partner and tutor inside a chat app. The learner is an English speaker practising ${L.name} at roughly CEFR level ${level}. Your name is ${L.tutor}. The app parses your reply, so follow this format exactly.
${scene ? "\n" + scene + "\nWhen a role-play is set, your first reply opens the scene in character instead of a general greeting.\n" : ""}

For every learner message, start with a <fix> block:
- If the message has grammar, spelling, word-order, gender/article, agreement, conjugation or word-choice mistakes, write:
<fix>
= the learner's whole message rewritten correctly in ${L.name}
- one short note in English per mistake: what was wrong and the rule behind it
- Tip: (optional, at most one) a more natural way a native speaker would say it
</fix>
- If it has no real mistakes, write exactly:
<fix>
✓
</fix>
- If the learner wrote in English, put the ${L.name} version on the "=" line and one note saying how they could have said it.
Only correct real mistakes, and be sure before you call something wrong. If the learner's version is grammatical and a native speaker would accept it, it is NOT a mistake: write the ✓ block, and if a different wording is more common, mention it only as a Tip. Double-check prepositions with places before correcting them (for example German "auf/von den Philippinen", "in die/aus der Schweiz"; French "aux/des Philippines", "en/de France"). Ignore missing capital letters at the start and missing final punctuation, and ignore likely speech-to-text slips.

After the </fix> block, continue the conversation in ${L.name}: react to what they said, share a little, and end with a question. Keep it to 2-4 short sentences, pitched at level ${level}: slightly challenging but understandable. No headings, no lists, plain sentences.

Optionally end with up to three words that are likely new at this level:
<vocab>
word — English meaning
</vocab>

Special cases:
- Your very first reply (answering the learner's greeting) has no <fix> block: just greet them, introduce yourself briefly by your name, and ask an easy question to get started.
- If the learner sends exactly "/explain", skip the <fix> block. In English, explain the grammar behind your most recent correction more fully, with two or three short ${L.name} example sentences, then invite them to continue in ${L.name}.
- Stay in ${L.name} for the conversation itself unless the learner is clearly lost and asks for help in English.`;
}

};

// ---------- parsing ----------
function parse(text) {
  let t = text.replace(/<[^>]*$/, "");            // hide a half-written tag while streaming
  const grab = (tag) => {
    const open = t.indexOf("<" + tag + ">");
    if (open < 0) return null;
    const close = t.indexOf("</" + tag + ">", open);
    const inner = t.slice(open + tag.length + 2, close < 0 ? t.length : close);
    t = t.slice(0, open) + (close < 0 ? "" : t.slice(close + tag.length + 3));
    return inner.trim();
  };
  const fixRaw = grab("fix");
  const vocabRaw = grab("vocab");
  let fix = null;
  if (fixRaw !== null) {
    const lines = fixRaw.split("\n").map(s => s.trim()).filter(Boolean);
    const ok = lines.length > 0 && /^(✓|✅|ok\b)/i.test(lines[0]) && !lines.some(l => l.startsWith("="));
    fix = { ok, fixed: "", notes: [], pending: fixRaw === "" };
    for (const l of lines) {
      if (l.startsWith("=")) fix.fixed = l.slice(1).trim();
      else if (/^[-•*]\s*/.test(l)) {
        const note = l.replace(/^[-•*]\s*/, "");
        fix.notes.push({ tip: /^tip:/i.test(note), text: note.replace(/^tip:\s*/i, "") });
      }
    }
  }
  const vocab = vocabRaw ? vocabRaw.split("\n").map(s => s.replace(/^[-•*]\s*/, "").trim()).filter(Boolean) : [];
  return { fix, vocab, body: t.trim() };
}

function paragraphs(el, text) {
  for (const para of text.split(/\n{2,}/)) {
    if (!para.trim()) continue;
    const p = document.createElement("p");
    // **bold** -> <strong>, everything else as text
    para.split(/(\*\*[^*]+\*\*)/).forEach(part => {
      if (/^\*\*[^*]+\*\*$/.test(part)) { const b = document.createElement("strong"); b.textContent = part.slice(2, -2); p.append(b); }
      else p.append(part.replace(/\n/g, " "));
    });
    el.append(p);
  }
}

// ---------- rendering ----------
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

// Word-level diff of what the learner wrote against the corrected sentence.
function diffWords(a, b) {
  const x = a.trim().split(/\s+/).filter(Boolean), y = b.trim().split(/\s+/).filter(Boolean);
  const n = x.length, m = y.length;
  // Spoken answers have no punctuation and the tutor ignores those, so compare without them
  // (and without the capital on the first word).
  const key = (w, k) => { const t = w.replace(/[.,!?;:«»„“”"'()…]/g, ""); return k === 0 ? t.toLowerCase() : t; };
  const same = (i, j) => key(x[i], i) === key(y[j], j);
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = same(i, j) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && same(i, j)) { ops.push(["=", y[j]]); i++; j++; }
    else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { ops.push(["+", y[j]]); j++; }
    else { ops.push(["-", x[i]]); i++; }
  }
  // Group runs so each change reads as "old → new"
  const groups = [];
  for (const [op, w] of ops) {
    const last = groups[groups.length - 1];
    if (op === "=") groups.push(["=", [w]]);
    else if (last && last[0] === "chg") (op === "-" ? last[1] : last[2]).push(w);
    else groups.push(["chg", op === "-" ? [w] : [], op === "+" ? [w] : []]);
  }
  return groups;
}

function diffNode(original, fixed) {
  const d = el("div", "diff");
  const groups = diffWords(original, fixed);
  const changed = groups.filter(g => g[0] === "chg").length;
  // A full rewrite reads better as just the corrected sentence
  if (!original || changed === 0 || groups.filter(g => g[0] === "=").length === 0) {
    d.append(el("ins", null, fixed));
    return d;
  }
  groups.forEach((g, k) => {
    if (k) d.append(" ");
    if (g[0] === "=") d.append(g[1].join(" "));
    else {
      if (g[1].length) d.append(el("del", null, g[1].join(" ")));
      if (g[1].length && g[2].length) d.append(" ");
      if (g[2].length) d.append(el("ins", null, g[2].join(" ")));
    }
  });
  return d;
}

function notesNode(notes) {
  const ul = el("ul", "notes");
  notes.forEach(n => ul.append(el("li", n.tip ? "tip" : "", n.text)));
  return ul;
}

function correctionNode(fix, isLatest, original) {
  const L = LANGS[lang];
  if (fix.ok) return el("div", "ok", L.perfect);
  const box = el("div", "fix");
  if (fix.fixed) box.append(diffNode(original, fix.fixed));
  if (fix.notes.length) box.append(notesNode(fix.notes));
  if (!fix.fixed && !fix.notes.length) box.append(dots());
  if (isLatest && !busy && fix.fixed && sampleState === "ready") {
    const more = el("button", "why", "Why?");
    more.type = "button";
    more.onclick = () => send("/explain");
    box.append(more);
  }
  return box;
}

function dots() {
  const d = el("span", "thinking");
  d.setAttribute("aria-label", "Thinking");
  d.append(el("i"), el("i"), el("i"));

}

const ICON_GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';

function tutorNodes(text, key, streaming, showName) {
  const { vocab, body } = parse(text);
  const parts = [];
  const bubble = el("div", "bubble");
  if (body) paragraphs(bubble, body); else bubble.append(dots());
  parts.push(bubble);
  if (vocab.length) {
    const v = el("div", "vocab");
    vocab.forEach(item => {
      const [w, ...m] = item.split(/\s+[—–-]\s+/);
      const s = el("span"); s.append(el("b", null, w));
      if (m.length) s.append(" " + m.join(" – "));
      v.append(s);
    });
    parts.push(v);
  }
  if (!streaming && body) {
    const tr = translations[key];
    const tools = el("div", "tools");
    if (canSpeak) {
      const say = iconLink(ICON_SPEAKER, "Listen");
      say.onclick = () => speak(body.replace(/\*\*/g, ""));
      tools.append(say);
    }
    if (!(tr && tr.text) && sampleState === "ready") {
      const b = iconLink(ICON_GLOBE, tr && tr.loading ? "Translating…" : "Translate");
      b.disabled = !!(tr && tr.loading);
      b.onclick = () => translate(key, body);
      tools.append(b);
    }
    if (tools.childElementCount) parts.push(tools);
    if (tr && tr.text) parts.push(el("div", "translation", tr.text));
  }
  return [tutorRow(parts, showName)];
}

// ---------- voice ----------
// Rank the device's voices so a natural-sounding female voice wins.
const FEMALE = {
  de: /anna|petra|helena|marlene|vicki|katja|hedda|amala|louisa|seraphina|tanja|ingrid|google deutsch/i,
  fr: /am[ée]lie|audrey|aur[ée]lie|marie|julie|hortense|denise|c[ée]line|l[ée]a|virginie|eloise|vivienne|brigitte|google fran[cç]ais/i
};
const MALE = /markus|yannick|martin|thomas|daniel|nicolas|henri|paul|stefan|conrad|killian|jacques|fred|eddy|reed|rocko|grandpa|klaus|hans|jonas|antoine|alain|remy|gerard|florian|ralf/i;
const NOVELTY = /eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|bells|bubbles|jester|organ|trinoids|whisper|zarvox|albert|bad news|boing|cellos|good news|superstar|wobble/i;

function scoreVoice(v) {
  let s = 0;
  if (/premium|enhanced|natural|neural|online|wavenet|studio/i.test(v.name)) s += 6;
  if (v.localService === false) s += 3;                       // cloud voices are usually the most natural
  if (FEMALE[lang].test(v.name)) s += 4;
  if (MALE.test(v.name)) s -= 6;
  if (NOVELTY.test(v.name)) s -= 10;
  if (/compact/i.test(v.name)) s -= 2;
  return s;
}

function voicesFor() {
  if (!canSpeak) return [];
  return window.speechSynthesis.getVoices()
    .filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(lang))
    .sort((a, b) => scoreVoice(b) - scoreVoice(a) || a.name.localeCompare(b.name));
}

function chosenVoice() {
  const list = voicesFor();
  const saved = store.get("tt:voice:" + lang, "");
  return list.find(v => v.voiceURI === saved) || list[0] || null;
}

const voicePrefs = { rate: store.get("tt:rate", 0.95), auto: store.get("tt:auto", false), volume: store.get("tt:volume", 1) };

let speakId = 0;
function speak(text, onEnd) {
  const id = ++speakId;
  const done = () => { if (id === speakId && onEnd) onEnd(); };
  if (cloudVoiceOn()) {
    speakCloud(text, id).then(r => { if (r === "ok") done(); }).catch((e) => {
      if (id !== speakId) return;
      errorMsg = e && e.status === -1 ? "Your phone paused the natural voice. Tap anywhere to bring it back; the phone voice read this one."
        : e && e.status === 401 ? "The ElevenLabs key didn't work, so the phone voice is reading instead."
        : e && (e.status === 402 || e.status === 429) ? "Your ElevenLabs allowance is used up for now, so the phone voice is reading instead."
        : "The natural voice couldn't load, so the phone voice is reading instead.";
      render();
      speakDevice(text, done);
    });
    return;
  }
  speakDevice(text, done);
}

function stopSpeaking() {
  speakId++;                                            // stale callbacks are ignored
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch {}
  if (player) { try { player.pause(); } catch {} if (player.finish) player.finish(); }
}

// ---------- natural cloud voice (ElevenLabs, only on the standalone site) ----------
const EL_DEFAULT_VOICE = "EXAVITQu4vr4xnSDxMaL";
let elKey = IN_CLAUDE ? "" : store.get("tt:elkey", "");
let elVoices = null;                                    // the account's voices, once loaded
const player = IN_CLAUDE ? null : new Audio();
let playerUrl = null;
const cloudVoiceOn = () => !!(player && elKey);
const elVoiceFor = (l) => store.get("tt:elvoice:" + l, EL_DEFAULT_VOICE);

async function speakCloud(text, id) {
  const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(elVoiceFor(lang))}?output_format=mp3_44100_128`, {
    method: "POST",
    headers: { "xi-api-key": elKey, "Content-Type": "application/json", Accept: "audio/mpeg" },
    body: JSON.stringify({ text, model_id: "eleven_multilingual_v2" })
  });
  if (!res.ok) throw { status: res.status };
  const blob = await res.blob();
  if (id !== speakId) return "stale";
  if (playerUrl) URL.revokeObjectURL(playerUrl);
  playerUrl = URL.createObjectURL(blob);
  player.src = playerUrl;
  player.preservesPitch = true;
  player.playbackRate = voicePrefs.rate;
  applyVolume();
  if (audioCtx && audioCtx.state !== "running") { try { await audioCtx.resume(); } catch {} }
  if (audioCtx && audioCtx.state !== "running") throw { status: -1 };   // paused by the phone: read with the phone voice instead
  await new Promise((resolve, reject) => {
    player.finish = () => { player.finish = null; resolve(); };
    player.onended = () => player.finish && player.finish();
    player.onerror = () => { player.finish = null; reject({ status: 0 }); };
    player.play().catch(() => { player.finish = null; reject({ status: 0 }); });
  });
  return id === speakId ? "ok" : "stale";
}

// Phones only play sound that starts from a tap. Playing a tiny silent clip during a tap
// lets later replies play by themselves.
function silentWav() {
  const rate = 8000, n = 400, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}
// Volume for the natural voice goes through Web Audio: iPhones ignore an audio element's
// own volume setting. This also allows a small boost above 100%.
let audioCtx = null, gainNode = null;
function setupGain() {
  if (!player || gainNode) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
    gainNode = audioCtx.createGain();
    audioCtx.createMediaElementSource(player).connect(gainNode).connect(audioCtx.destination);
  } catch { audioCtx = null; gainNode = null; }
  applyVolume();
}
function applyVolume() {
  if (!player) return;
  if (gainNode) { gainNode.gain.value = voicePrefs.volume; player.volume = 1; }
  else player.volume = Math.min(1, voicePrefs.volume);
}

// Any tap wakes the audio engine back up after the phone pauses it (e.g. after switching apps)
if (player) ["touchend", "click"].forEach(ev => document.addEventListener(ev, () => {
  if (audioCtx && audioCtx.state !== "running") { try { audioCtx.resume(); } catch {} }
}, { passive: true }));

function unlockAudio() {
  setupGain();
  if (audioCtx && audioCtx.state === "suspended") { try { audioCtx.resume(); } catch {} }
  if (!player || player.dataset.unlocked) return;
  try { player.src = silentWav(); const p = player.play(); if (p) p.then(() => { player.dataset.unlocked = "1"; }).catch(() => {}); } catch {}
}

async function loadElVoices() {
  if (!elKey) return;
  try {
    const res = await fetch("https://api.elevenlabs.io/v1/voices", { headers: { "xi-api-key": elKey } });
    if (!res.ok) throw { status: res.status };
    const data = await res.json();
    elVoices = (data.voices || []).map(v => ({ id: v.voice_id, name: v.name, gender: (v.labels && v.labels.gender) || "", accent: (v.labels && v.labels.accent) || "" }))
      .sort((a, b) => (b.gender === "female") - (a.gender === "female") || a.name.localeCompare(b.name));
  } catch (e) {
    elVoices = [];

function speakDevice(text, done) {
  if (!canSpeak) { done(); return; }
  try {
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "de" ? "de-DE" : "fr-FR";
    const voice = chosenVoice();
    if (voice) u.voice = voice;
    u.rate = voicePrefs.rate;
    u.volume = Math.min(1, voicePrefs.volume);
    u.pitch = 1.05;
    u.onend = done;
    u.onerror = done;
    synth.speak(u);
  } catch { done(); }
}

// ---------- talking to Claude ----------
const ERRORS = {
  not_granted: "Claude access wasn't allowed for this page. Reload the page to be asked again.",
  sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "You've hit a usage limit. Wait a little, then send again.",
  session_expired: "Your Claude session expired. Sign in again, then resend.",
  refused: "Claude couldn't answer that message. Try saying it differently.",
  empty_completion: "The tutor didn't reply. Try sending again.",
  prompt_too_large: "The conversation got too long. Tap New chat to start fresh."
};

ERRORS.no_key = "Add your Claude API key (speaker icon at the top) to start.";
ERRORS.bad_key = "That API key didn't work. Check it under the speaker icon at the top.";
ERRORS.bad_request = "Claude couldn't process that request. Start a new chat and try again.";

// ---------- backends ----------
// Inside Claude the page asks Claude through the viewer's own account (`sample`).
// Opened on its own web address (GitHub Pages), it calls the Claude API with the learner's key.
const MODEL = "claude-opus-5-5";
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.126.0/+esm";
const MIC_APP_URL = "https://vernaellaine.github.io/hello-world/";
let Anthropic = null, apiClient = null;
let apiKey = store.get("tt:apikey", "");

function makeClient() {
  apiClient = Anthropic && apiKey ? new Anthropic({ apiKey, dangerouslyAllowBrowser: true }) : null;
}

async function ask({ system, turns: msgs, prompt }, { onText, signal } = {}) {
  if (sample) {
    const input = prompt ?? [{ role: "user", content: system }, ...msgs];
    return sample(input, { cache: false, signal, onText });
  }
  if (!apiClient) throw { code: "no_key" };
  let messages = prompt ? [{ role: "user", content: prompt }] : msgs.slice();
  while (messages.length && messages[0].role !== "user") messages.shift();
  try {
    const stream = apiClient.beta.messages.stream({
      model: MODEL,
      max_tokens: 16000,
      ...(system ? { system } : {}),
      messages,
      thinking: { type: "adaptive" },
      output_config: { effort: "medium" },     // enough thinking to keep corrections accurate
      // If a reply is declined by a safety classifier, retry it on Anthropic's recommended fallback model.
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
    }, { signal });
    if (onText) stream.on("text", (delta, text) => onText({ text, delta }));
    const msg = await stream.finalMessage();
    if (msg.stop_reason === "refusal") throw { code: "refused" };
    const text = msg.content.filter(b => b.type === "text").map(b => b.text).join("");
    if (!text.trim()) throw { code: "empty_completion" };
    return { text };
  } catch (e) {
    if (e && e.code && !(e instanceof Error)) throw e;
    if (signal?.aborted || e instanceof Anthropic.APIUserAbortError) throw { code: "cancelled" };
    if (e instanceof Anthropic.AuthenticationError || e instanceof Anthropic.PermissionDeniedError) throw { code: "bad_key" };
    if (e instanceof Anthropic.RateLimitError) throw { code: "rate_limited" };
    if (e instanceof Anthropic.BadRequestError) throw { code: "bad_request" };
    throw { code: "upstream_error" };
  }
}

// ---------- talking out loud ----------
const SR = IN_CLAUDE ? null : (window.SpeechRecognition || window.webkitSpeechRecognition || null);
const canListen = !!SR;
let rec = null, listening = false;
let handsFree = canListen && store.get("tt:handsfree", false);

// How long you can pause before your answer is sent
const PAUSES = { short: 1800, normal: 3000, long: 5000 };
let pauseKey = store.get("tt:pause", "normal");
if (!PAUSES[pauseKey]) pauseKey = "normal";
const NOTHING_HEARD_MS = 9000;

// One spoken answer can span several recognition sessions: phones end a session on their own
// after a short pause, so we quietly restart it and only send once you've been silent for a while.
let turn = null;

function joinResults(results) {
  const parts = [];
  for (let i = 0; i < results.length; i++) {
    const t = results[i][0].transcript.trim();
    if (!t) continue;
    const last = parts[parts.length - 1];
    // Some Android phones repeat the whole phrase so far in each new result
    if (last && t.toLowerCase().startsWith(last.toLowerCase())) parts[parts.length - 1] = t;
    else if (!(last && last.toLowerCase().startsWith(t.toLowerCase()))) parts.push(t);
  }
  return parts.join(" ");
}

const heardSoFar = (t) => (t.committed + " " + t.current).trim();

function armSilenceTimer(t) {
  clearTimeout(t.timer);
  t.timer = setTimeout(() => finishTurn(false), heardSoFar(t) ? PAUSES[pauseKey] : NOTHING_HEARD_MS);
}

function listen() {
  if (!canListen || listening || busy || sampleState !== "ready") return;
  stopSpeaking();
  const t = { committed: "", current: "", timer: null, done: false, cancelled: false, fatal: false, quickEnds: 0 };
  turn = t;
  input.value = "";
  listening = true; errorMsg = "";
  armSilenceTimer(t);
  startSession(t);
  render();
}

function startSession(t) {
  const r = new SR();
  r.lang = lang === "de" ? "de-DE" : "fr-FR";
  r.interimResults = true;
  r.continuous = true;
  r.maxAlternatives = 1;
  const startedAt = Date.now();
  r.onresult = (e) => {
    if (turn !== t) return;
    t.current = joinResults(e.results);
    input.value = heardSoFar(t);
    autosize();
    armSilenceTimer(t);
  };
  r.onerror = (e) => {
    if (turn !== t) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      errorMsg = "Microphone access is blocked. Allow it for this site in your browser settings, then tap the mic.";
      handsFree = false; store.set("tt:handsfree", false);
      t.fatal = true;
    } else if (e.error === "network") {
      errorMsg = "Speech recognition needs an internet connection.";
      t.fatal = true;
    }
    // "no-speech" and "aborted" are normal here: the session just restarts
  };
  r.onend = () => {
    if (turn !== t) return;
    rec = null;
    t.committed = heardSoFar(t); t.current = "";
    if (t.done || t.fatal) { finalizeTurn(t); return; }
    // A session that keeps dying straight away means the mic isn't really available
    t.quickEnds = Date.now() - startedAt < 400 ? t.quickEnds + 1 : 0;
    if (t.quickEnds >= 4) { errorMsg = "The mic keeps stopping. Tap it to try again."; t.fatal = true; finalizeTurn(t); return; }
    setTimeout(() => { if (turn === t && !t.done) startSession(t); }, 60);
  };
  rec = r;
  try { r.start(); } catch { t.fatal = true; finalizeTurn(t); }
}

function finishTurn(cancel) {
  const t = turn;
  if (!t || t.done) return;
  t.done = true; t.cancelled = !!cancel;
  clearTimeout(t.timer);
  if (rec) { try { rec.stop(); } catch { finalizeTurn(t); } }   // onend delivers the last words, then finalizes
  else finalizeTurn(t);
}

function finalizeTurn(t) {
  if (turn !== t) return;
  clearTimeout(t.timer);
  turn = null; rec = null; listening = false;
  const text = heardSoFar(t);
  input.value = ""; autosize();
  if (text && !t.cancelled) { send(text); return; }
  if (!text && !t.cancelled && !t.fatal) errorMsg = "I didn't hear anything. Tap the mic when you're ready.";
  render();
}

function stopListening(cancel) { finishTurn(cancel); }

async function send(content, opening = false) {
  if (busy || !(sample || apiClient)) return;
  const L = LANGS[lang], T = turns[lang], myLang = lang;
  errorMsg = "";
  T.push({ role: "user", content });
  busy = true; pending = ""; ctl = new AbortController();
  unlockSpeech();
  render();
  const history = T.slice(-MAX_TURNS);
  try {
    const { text } = await ask({ system: rules(L, $("level").value, scenes[myLang].brief), turns: history }, {
      signal: ctl.signal,
      onText: ({ text }) => { if (lang === myLang) { pending = text; render(); } }
    });
    T.push({ role: "assistant", content: text });
    if (lang === myLang) {
      const spoken = parse(text).body.replace(/\*\*/g, "");
      // Hands-free: read the reply, then listen for the answer
      if (handsFree) setTimeout(() => speak(spoken, () => listen()), 0);
      else if (voicePrefs.auto) speak(spoken);
    }
    store.set("tt:turns:" + myLang, T);
    const { fix } = parse(text);
    if (!opening && content !== "/explain" && fix && !fix.ok && fix.fixed) {
      notebook.unshift({ lang: myLang, original: content, fixed: fix.fixed, notes: fix.notes, at: Date.now() });
      notebook = notebook.slice(0, MAX_NOTEBOOK);
      store.set("tt:notebook", notebook);
    }
  } catch (e) {
    T.pop();                                                   // take the message back so it can be resent
    if (!opening && content !== "/explain" && !input.value) input.value = content;
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) sampleState = "absent";
    if (e && e.code === "bad_key") { sampleState = "nokey"; }
    if (!(e && e.code === "cancelled")) errorMsg = ERRORS[e && e.code] || "The connection dropped before the tutor finished. Send again.";
  } finally {
    busy = false; pending = null; ctl = null;
    if (lang === myLang) render(); else renderControls();
    autosize();
  }
}

async function translate(key, body) {
  if (!(sample || apiClient)) return;
  translations[key] = { loading: true }; render();
  try {
    const { text } = await ask({ prompt: `Translate this ${LANGS[lang].name} text into natural English. Reply with only the translation.\n\n${body}` });
    translations[key] = { text };
  } catch (e) {
    delete translations[key];
    if (!(e && e.code === "cancelled")) errorMsg = ERRORS[e && e.code] || "Couldn't translate that. Try again.";
  }
  render();
}

// ---------- events ----------
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy) { ctl?.abort(); return; }
  if (listening) { stopListening(false); return; }
  const text = input.value.trim();
  if (!text) { unlockAudio(); listen(); return; }
  input.value = ""; autosize();
  send(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer: fine)").matches) {
    e.preventDefault(); $("composer").requestSubmit();
  }
});
input.addEventListener("input", () => { autosize(); renderControls(); });

$("handsfree").addEventListener("click", () => {
  handsFree = !handsFree; store.set("tt:handsfree", handsFree);
  if (handsFree) { unlockSpeech(); if (!busy && turns[lang].length) listen(); }
  else stopListening(true);
  renderControls();
});

$("voice").addEventListener("click", () => {
  const panel = $("voice-panel");
  panel.hidden = !panel.hidden;
  $("voice").setAttribute("aria-expanded", String(!panel.hidden));
  renderVoicePanel();
});

$("nb").addEventListener("click", () => {
  view = view === "notebook" ? "chat" : "notebook";
  render();
  scroller.scrollTop = view === "notebook" ? 0 : scroller.scrollHeight;
});

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  if (busy || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set("tt:lang", lang); errorMsg = "";
  render();
}));
$("level").addEventListener("change", () => store.set("tt:level", $("level").value));

// Stop whatever is in progress: a reply, the mic, the voice
function stopEverything() {
  if (busy) ctl?.abort();
  stopListening(true);
  stopSpeaking();
}

$("home").addEventListener("click", () => {
  stopEverything();
  $("reset-note").hidden = true;
  $("voice-panel").hidden = true; $("voice").setAttribute("aria-expanded", "false");
  view = "home"; errorMsg = "";
  render();
  scroller.scrollTop = 0;
});

$("reset").addEventListener("click", () => { $("reset-note").hidden = !$("reset-note").hidden; });
$("reset-cancel").addEventListener("click", () => { $("reset-note").hidden = true; });
$("reset-yes").addEventListener("click", () => {
  $("reset-note").hidden = true;
  stopEverything();
  errorMsg = "";
  // Same language and scene, fresh conversation, once any cancelled reply has finished stopping
  const myLang = lang, t0 = Date.now();
  (function go() {
    if (busy && Date.now() - t0 < 3000) { setTimeout(go, 50); return; }
    if (lang === myLang) startChat(scenes[myLang]);
  })();
});

render();
(async () => {
  if (IN_CLAUDE) {
    try { sample = await window.claude.use("sample"); } catch { sample = null; }
    sampleState = sample ? "ready" : "absent";
  } else {
    try {
      ({ default: Anthropic } = await import(SDK_URL));
      makeClient();
      sampleState = apiClient ? "ready" : "nokey";
    } catch { sampleState = "offline"; }
  }
  render();
})();
</script>

</body>
</html>
