<title>Tandem Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one-screen chat app. Floating glass header and composer over a colour wash
   that changes with the language (German = tangerine/sun, French = cobalt/coral). */
:root {
  --bg: #F2F4F3;
  --surface: rgba(255, 255, 255, 0.82);
  --solid: #FFFFFF;
  --ink: #15171C;
  --muted: #626A75;
  --line: rgba(21, 23, 28, 0.09);
  --accent: #FF4D2E;
  --accent-2: #FFB300;
  --on-accent: #FFFFFF;
  --pen: #E5322D;
  --pen-wash: #FFF0EC;
  --ok: #0E9F6E;
  --ok-wash: #DDF7EC;
  --wash-1: rgba(255, 77, 46, 0.30);
  --wash-2: rgba(255, 179, 0, 0.32);
  --shadow: 0 10px 30px -12px rgba(21, 23, 28, 0.22);
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-pen: "Kalam", "Bradley Hand", "Comic Sans MS", cursive;
}
:root[data-lang="fr"] {
  --accent: #2B50FF; --accent-2: #FF5C8A;
  --wash-1: rgba(43, 80, 255, 0.26); --wash-2: rgba(255, 92, 138, 0.28);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1014; --surface: rgba(28, 31, 38, 0.80); --solid: #1C1F26; --ink: #F2F3F5; --muted: #9AA2AE;
    --line: rgba(255, 255, 255, 0.09); --on-accent: #FFFFFF; --pen: #FF6B5E; --pen-wash: #2A1A1A; --ok: #3DDC97; --ok-wash: #12261E;
    --wash-1: rgba(255, 77, 46, 0.22); --wash-2: rgba(255, 179, 0, 0.14);
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
  :root[data-lang="fr"]:not([data-theme="light"]) { --accent: #5B76FF; --wash-1: rgba(43, 80, 255, 0.26); --wash-2: rgba(255, 92, 138, 0.16); }
}
:root[data-theme="dark"] {
  --bg: #0E1014; --surface: rgba(28, 31, 38, 0.80); --solid: #1C1F26; --ink: #F2F3F5; --muted: #9AA2AE;
  --line: rgba(255, 255, 255, 0.09); --on-accent: #FFFFFF; --pen: #FF6B5E; --pen-wash: #2A1A1A; --ok: #3DDC97; --ok-wash: #12261E;
  --wash-1: rgba(255, 77, 46, 0.22); --wash-2: rgba(255, 179, 0, 0.14);
  --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}
:root[data-theme="dark"][data-lang="fr"] { --accent: #5B76FF; --wash-1: rgba(43, 80, 255, 0.26); --wash-2: rgba(255, 92, 138, 0.16); }

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(60% 45% at 100% 0%, var(--wash-1), transparent 70%),
    radial-gradient(55% 40% at 0% 100%, var(--wash-2), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 16.5px/1.5 var(--font-body);
  display: flex; flex-direction: column; overflow: hidden;
  transition: background-color 300ms;
}
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.grad { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }

/* Header */
header {
  flex: none; padding-block: 10px 6px; padding-inline: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.bar { display: flex; align-items: center; gap: 10px; max-width: 720px; width: 100%; margin: 0 auto; }
.logo {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none;
  color: var(--on-accent); font: 800 15px/1 var(--font-display); letter-spacing: -0.04em;
  box-shadow: 0 6px 16px -6px var(--accent);
}
.brand { font: 700 18px/1.05 var(--font-display); letter-spacing: -0.03em; margin-right: auto; min-width: 0; }
.brand small { display: block; font: 500 12px/1.3 var(--font-body); color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.icon-btn {
  position: relative; flex: none; width: 40px; height: 40px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: grid; place-items: center; box-shadow: var(--shadow);
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-expanded="true"], .icon-btn.on { background: var(--ink); color: var(--bg); border-color: transparent; }
.icon-btn.armed { background: var(--pen); color: #FFFFFF; border-color: transparent; }
.badge {
  position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  font: 700 11px/18px var(--font-body); color: var(--on-accent); text-align: center; font-variant-numeric: tabular-nums;
}
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toast-label { font-size: 12px; font-weight: 600; color: var(--pen); }

.seg {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
  border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow);
}
.seg button {
  border: 0; background: transparent; border-radius: 12px; padding: 8px 6px;
  font: 600 15px/1.2 var(--font-body); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px;
}
.seg button .code { font: 700 11px/1 var(--font-display); letter-spacing: 0.02em; padding: 4px 5px; border-radius: 6px; background: var(--line); }
.seg button[aria-pressed="true"] { color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px -8px var(--accent); }
.seg button[aria-pressed="true"] .code { background: rgba(255, 255, 255, 0.25); }
.level {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; height: 48px;
  padding: 0 10px; font: 700 14px/1 var(--font-display); box-shadow: var(--shadow);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}

/* Transcript */
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.log { max-width: 720px; margin: 0 auto; padding-block: 10px 28px; padding-inline: 16px; display: flex; flex-direction: column; gap: 16px; }

.row { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row.me { align-items: flex-end; }
.row.tutor { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  color: var(--on-accent); font: 700 13px/1 var(--font-display); box-shadow: 0 4px 12px -4px var(--accent);
}
.who { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; }
.bubble { max-width: 90%; min-width: 0; padding: 11px 15px; border-radius: 22px; overflow-wrap: anywhere; }
.me .bubble {
  color: var(--on-accent); border-bottom-right-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 22px -12px var(--accent);
}
.me .bubble.meta { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); box-shadow: none; font-style: italic; }
.tutor .bubble {
  background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 8px; box-shadow: var(--shadow);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.bubble p { margin: 0; }
.bubble p + p { margin-top: 8px; }
.bubble strong { font-weight: 700; }
.thinking { color: var(--muted); display: inline-flex; gap: 4px; align-items: center; min-height: 1.5em; }
.thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: 0.35; }
@media (prefers-reduced-motion: no-preference) {
  .thinking i { animation: blink 1.1s infinite ease-in-out; }
  .thinking i:nth-child(2) { animation-delay: 0.15s; }
  .thinking i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 40% { opacity: 1; transform: translateY(-3px); } }
}

/* Red-pen correction sticker, attached under the learner's message */
.pen {
  position: relative; max-width: 90%; min-width: 0; align-self: flex-end; margin-top: 10px;
  background: var(--solid); border-radius: 18px; padding: 16px 16px 12px;
  border: 1.5px solid color-mix(in srgb, var(--pen) 35%, transparent);
  box-shadow: 0 12px 26px -16px var(--pen);
}
.pen::before {
  content: attr(data-label); position: absolute; top: -11px; left: 14px; transform: rotate(-3deg);
  background: var(--pen); color: #FFFFFF; font: 700 11px/1 var(--font-display); letter-spacing: 0.04em;
  padding: 5px 9px; border-radius: 8px; text-transform: uppercase;
}
.pen .fixed { font: 700 21px/1.3 var(--font-pen); color: var(--pen); overflow-wrap: anywhere; }
.pen ul { margin: 6px 0 0; padding-left: 18px; font-size: 14.5px; color: var(--ink); }
.pen li + li { margin-top: 4px; }
.pen li.tip { list-style: "→ "; color: var(--muted); }
.pen .more {
  margin-top: 10px; border: 0; background: var(--pen-wash); color: var(--pen); padding: 6px 12px; border-radius: 999px;
  font-weight: 700; font-size: 13px;
}
.stamp {
  align-self: flex-end; font: 700 18px/1 var(--font-pen); color: var(--ok); background: var(--ok-wash);
  border: 1.5px solid color-mix(in srgb, var(--ok) 40%, transparent);
  padding: 7px 12px 5px; border-radius: 999px; transform: rotate(-4deg);
}

.vocab { max-width: 90%; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.vocab span { border-radius: 999px; padding: 3px 10px; background: var(--surface); border: 1px solid var(--line); }
.vocab b { color: var(--accent); font-weight: 700; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.link {
  border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
}
.link:hover { color: var(--ink); }
.translation { max-width: 90%; font-size: 14.5px; color: var(--muted); font-style: italic; border-left: 3px solid var(--accent-2); padding-left: 10px; }
.error { align-self: center; font-size: 14px; font-weight: 600; color: var(--pen); text-align: center; max-width: 34ch; background: var(--pen-wash); padding: 8px 14px; border-radius: 14px; }
.scene {
  align-self: center; font: 700 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--accent); background: var(--surface); border: 1px solid var(--line); padding: 7px 12px; border-radius: 999px;
}

/* Welcome */
.welcome { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.hero h1 {
  margin: 0; font: 800 clamp(30px, 9vw, 46px)/1.02 var(--font-display); letter-spacing: -0.045em; text-wrap: balance;
}
.hero h1 em {
  font-style: normal; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { margin: 10px 0 0; color: var(--muted); font-size: 16px; max-width: 46ch; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px;
  box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.eyebrow { font: 700 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 8px; text-align: left;
  border: 1.5px solid var(--line); background: var(--solid); border-radius: 16px; padding: 10px 12px;
  font-size: 14px; font-weight: 600; line-height: 1.2;
}
.chip .ico { font-size: 20px; line-height: 1; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.primary {
  border: 0; border-radius: 18px; padding: 16px 22px; width: 100%;
  color: var(--on-accent); font: 700 17px/1 var(--font-display); letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 14px 30px -14px var(--accent);
}
.primary:disabled { opacity: 0.5; cursor: default; }
.hint { font-size: 13.5px; color: var(--muted); margin: 0; }

/* Composer */
footer { flex: none; padding-block: 6px calc(12px + env(safe-area-inset-bottom, 0px)); padding-inline: 12px; }
.composer {
  max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 8px;
  box-shadow: var(--shadow); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.keys { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-inline: 2px; }
.keys::-webkit-scrollbar { display: none; }
.keys button {
  flex: none; min-width: 34px; height: 32px; border: 0; background: var(--line); border-radius: 10px; padding: 0 8px; font-size: 16px; font-weight: 600;
}
.inputrow { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; min-width: 0; resize: none; max-height: 140px; border: 0; background: transparent;
  padding: 10px 8px 10px 10px; font-size: 17px; line-height: 1.35;
}
textarea:focus-visible { outline: none; }
.send {
  flex: none; width: 46px; height: 46px; border-radius: 16px; border: 0; color: var(--on-accent); display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 18px -8px var(--accent);
}
.send.stop { background: var(--ink); color: var(--bg); box-shadow: none; }
.send:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
.send svg { width: 20px; height: 20px; }

/* Voice settings */
.panel { flex: none; padding-block: 0 8px; padding-inline: 16px; max-height: 55vh; overflow-y: auto; }
.panel-inner {
  max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: var(--shadow);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.panel-row { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 15px; }
.panel-row select { flex: 1; min-width: 0; font-size: 15px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--solid); }
.panel-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.panel-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.ghost { border: 1px solid var(--line); background: var(--solid); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; }

/* Notebook */
.notebook { display: flex; flex-direction: column; gap: 14px; }
.nb-head { display: flex; flex-direction: column; gap: 10px; }
.nb-head h1 { margin: 0; font: 800 30px/1.05 var(--font-display); letter-spacing: -0.04em; text-wrap: balance; }
.nb-head p { margin: 0; color: var(--muted); }
.nb-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 16px 14px; min-width: 0;
  box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.nb-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.nb-was { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; overflow-wrap: anywhere; margin-top: 6px; }
.nb-card .fixed { font: 700 21px/1.3 var(--font-pen); color: var(--pen); overflow-wrap: anywhere; }
.nb-card ul { margin: 6px 0 0; padding-left: 18px; font-size: 14.5px; }
.nb-card li.tip { list-style: "→ "; color: var(--muted); }
</style>

<header>
  <div class="bar">
    <div class="logo grad" aria-hidden="true">Tt</div>
    <div class="brand">Tandem<small>Talk. Get corrected. Keep going.</small></div>
    <button id="voice" class="icon-btn" type="button" aria-expanded="false" aria-controls="voice-panel" aria-label="Voice settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button id="nb" class="icon-btn" type="button" aria-label="Mistake notebook">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
      <span class="badge grad" id="nb-count" hidden></span>
    </button>
    <button id="reset" class="icon-btn" type="button" aria-label="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-de" data-lang="de" aria-pressed="true"><span class="code">DE</span>Deutsch</button>
      <button id="lang-fr" data-lang="fr" aria-pressed="false"><span class="code">FR</span>Français</button>
    </div>
    <select id="level" class="level" aria-label="Your level (CEFR)">
      <option>A1</option><option selected>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option>
    </select>
  </div>
  <div class="bar toast-label" id="reset-note" hidden>Tap + again to clear this chat</div>
</header>

<section id="voice-panel" class="panel" hidden></section>

<main id="scroller"><div class="log" id="log"></div></main>

<footer>
  <form class="composer" id="composer">
    <div class="keys" id="keys" aria-label="Special characters"></div>
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="Schreib etwas auf Deutsch…" aria-label="Your message"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </form>
</footer>

<script>
const LANGS = {
  de: {
    name: "German", native: "Deutsch",
    greet: "Hallo! Ich möchte Deutsch üben.",
    placeholder: "Schreib etwas auf Deutsch…",
    tutor: "Lena", fixLabel: "Korrektur", heroA: "Sprich mit mir. ", heroB: "Ich korrigiere dich.",
    perfect: "Perfekt!",
    keys: ["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü", "„", "“"],
    example: {
      me: "Gestern ich habe ins Kino gegangen.",
      fixed: "Gestern bin ich ins Kino gegangen.",
      notes: ["After a time word like „gestern“, the verb comes second: „Gestern bin ich…“.", "„gehen“ shows movement, so the perfect tense uses „sein“, not „haben“."],
      reply: "Oh, schön! Welchen Film hast du gesehen?"
    }
  },
  fr: {
    name: "French", native: "Français",
    greet: "Bonjour ! Je voudrais pratiquer le français.",
    placeholder: "Écris quelque chose en français…",
    tutor: "Camille", fixLabel: "Correction", heroA: "Parle avec moi. ", heroB: "Je te corrige.",
    perfect: "Parfait !",
    keys: ["é", "è", "ê", "à", "â", "ç", "ô", "î", "ù", "û", "œ", "ë", "«", "»"],
    example: {
      me: "Hier j'ai allé au cinéma avec mon amie.",
      fixed: "Hier, je suis allée au cinéma avec mon amie.",
      notes: ["« aller » takes « être » in the passé composé: « je suis allé(e) ».", "With « être », the past participle agrees with the subject (allée if you're female)."],
      reply: "Super ! Qu'est-ce que vous avez vu ?"
    }
  }
};

const MAX_TURNS = 40;
const MAX_NOTEBOOK = 200;

// Role-play scenes. `brief` goes to Claude; `label` is what the learner sees.
const SCENES = [
  { id: "free", icon: "💬", label: "Free chat", brief: "" },
  { id: "cafe", icon: "☕", label: "Ordering at a café", brief: "Role-play: you are a friendly server at a café and the learner is a customer. Stay in character: take their order, answer questions about the menu, mention prices, bring the bill." },
  { id: "bakery", icon: "🥐", label: "At the bakery", brief: "Role-play: you work at a bakery and the learner is buying bread and pastries. Stay in character: suggest items, give prices, count change." },
  { id: "directions", icon: "🗺️", label: "Asking for directions", brief: "Role-play: you are a local on the street and the learner is a lost tourist. Stay in character and give directions with real landmarks." },
  { id: "hotel", icon: "🛎️", label: "Hotel check-in", brief: "Role-play: you are a hotel receptionist and the learner is checking in. Stay in character: reservation, passport, breakfast times, wifi, a small problem with the room." },
  { id: "doctor", icon: "🩺", label: "At the doctor's", brief: "Role-play: you are a doctor and the learner is a patient describing symptoms. Stay in character, ask follow-up questions and give simple advice." },
  { id: "interview", icon: "💼", label: "Job interview", brief: "Role-play: you are interviewing the learner for a job they choose. Stay in character and ask typical interview questions one at a time." },
  { id: "smalltalk", icon: "🥂", label: "Meeting a new friend", brief: "Role-play: you have just met the learner at a party. Make small talk: where they're from, work, hobbies, plans." }
];

function reviewBrief(mistakes) {
  const list = mistakes.map(m => `- They wrote "${m.original}" → correct: "${m.fixed}"`).join("\n");
  return `Review drill instead of free conversation. These are mistakes the learner made recently:\n${list}\n\nRun a short drill, one item at a time: give the learner a NEW English sentence to translate into the target language that practises the same rule as one of these mistakes (never reuse their exact sentence). When they answer, correct it in the <fix> block as usual, add one encouraging sentence, then give the next sentence. After about six items, sum up which rules they have mastered and which to keep practising. Your first reply: say hello, explain the drill in one sentence, and give the first sentence.`;
}

function rules(L, level, scene) {
  return `You are a warm, patient ${L.name} conversation partner and tutor inside a chat app. The learner is an English speaker practising ${L.name} at roughly CEFR level ${level}. Your name is ${L.tutor}. The app parses your reply, so follow this format exactly.
${scene ? "\n" + scene + "\nWhen a role-play is set, your first reply opens the scene in character instead of a general greeting.\n" : ""}

For every learner message, start with a <fix> block:
- If the message has grammar, spelling, word-order, gender/article, agreement, conjugation or word-choice mistakes, write:
<fix>
= the learner's whole message rewritten correctly in ${L.name}
- one short note in English per mistake: what was wrong and the rule behind it
- Tip: (optional, at most one) a more natural way a native speaker would say it
</fix>
- If it has no real mistakes, write exactly:
<fix>
✓
</fix>
- If the learner wrote in English, put the ${L.name} version on the "=" line and one note saying how they could have said it.
Only correct real mistakes. Ignore missing capital letters at the start and missing final punctuation.

After the </fix> block, continue the conversation in ${L.name}: react to what they said, share a little, and end with a question. Keep it to 2-4 short sentences, pitched at level ${level}: slightly challenging but understandable. No headings, no lists, plain sentences.

Optionally end with up to three words that are likely new at this level:
<vocab>
word — English meaning
</vocab>

Special cases:
- Your very first reply (answering the learner's greeting) has no <fix> block: just greet them, introduce yourself briefly by your name, and ask an easy question to get started.
- If the learner sends exactly "/explain", skip the <fix> block. In English, explain the grammar behind your most recent correction more fully, with two or three short ${L.name} example sentences, then invite them to continue in ${L.name}.
- Stay in ${L.name} for the conversation itself unless the learner is clearly lost and asks for help in English.`;
}

// ---------- state ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let lang = store.get("tt:lang", "de");
if (!LANGS[lang]) lang = "de";
const turns = { de: store.get("tt:turns:de", []), fr: store.get("tt:turns:fr", []) };
// The scene brief for each language's current chat ("" = free chat)
const scenes = { de: store.get("tt:scene:de", { label: "Free chat", brief: "" }), fr: store.get("tt:scene:fr", { label: "Free chat", brief: "" }) };
let notebook = store.get("tt:notebook", []);
let view = "chat";              // chat | notebook
const translations = {};
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
let pending = null;     // streaming assistant text, or "" while thinking
let busy = false;
let ctl = null;
let errorMsg = "";
let sample = null;
let sampleState = "loading"; // loading | ready | absent

const $ = (id) => document.getElementById(id);
const log = $("log"), scroller = $("scroller"), input = $("input"), sendBtn = $("send");
$("level").value = store.get("tt:level", "A2");

// ---------- parsing ----------
function parse(text) {
  let t = text.replace(/<[^>]*$/, "");            // hide a half-written tag while streaming
  const grab = (tag) => {
    const open = t.indexOf("<" + tag + ">");
    if (open < 0) return null;
    const close = t.indexOf("</" + tag + ">", open);
    const inner = t.slice(open + tag.length + 2, close < 0 ? t.length : close);
    t = t.slice(0, open) + (close < 0 ? "" : t.slice(close + tag.length + 3));
    return inner.trim();
  };
  const fixRaw = grab("fix");
  const vocabRaw = grab("vocab");
  let fix = null;
  if (fixRaw !== null) {
    const lines = fixRaw.split("\n").map(s => s.trim()).filter(Boolean);
    const ok = lines.length > 0 && /^(✓|✅|ok\b)/i.test(lines[0]) && !lines.some(l => l.startsWith("="));
    fix = { ok, fixed: "", notes: [], pending: fixRaw === "" };
    for (const l of lines) {
      if (l.startsWith("=")) fix.fixed = l.slice(1).trim();
      else if (/^[-•*]\s*/.test(l)) {
        const note = l.replace(/^[-•*]\s*/, "");
        fix.notes.push({ tip: /^tip:/i.test(note), text: note.replace(/^tip:\s*/i, "") });
      }
    }
  }
  const vocab = vocabRaw ? vocabRaw.split("\n").map(s => s.replace(/^[-•*]\s*/, "").trim()).filter(Boolean) : [];
  return { fix, vocab, body: t.trim() };
}

function paragraphs(el, text) {
  for (const para of text.split(/\n{2,}/)) {
    if (!para.trim()) continue;
    const p = document.createElement("p");
    // **bold** -> <strong>, everything else as text
    para.split(/(\*\*[^*]+\*\*)/).forEach(part => {
      if (/^\*\*[^*]+\*\*$/.test(part)) { const b = document.createElement("strong"); b.textContent = part.slice(2, -2); p.append(b); }
      else p.append(part.replace(/\n/g, " "));
    });
    el.append(p);
  }
}

// ---------- rendering ----------
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function correctionNode(fix, isLatest) {
  const L = LANGS[lang];
  if (fix.ok) return el("div", "stamp", "✓ " + L.perfect);
  const box = el("div", "pen");
  box.dataset.label = L.fixLabel;
  if (fix.fixed) box.append(el("div", "fixed", fix.fixed));
  if (fix.notes.length) {
    const ul = el("ul");
    fix.notes.forEach(n => ul.append(el("li", n.tip ? "tip" : "", n.text)));
    box.append(ul);
  }
  if (!fix.fixed && !fix.notes.length) box.append(dots());
  if (isLatest && !busy && fix.fixed && sampleState === "ready") {
    const more = el("button", "more", "Explain this rule");
    more.type = "button";
    more.onclick = () => send("/explain");
    box.append(more);
  }
  return box;
}

function dots() {
  const d = el("span", "thinking");
  d.setAttribute("aria-label", "Thinking");
  d.append(el("i"), el("i"), el("i"));
  return d;
}

function avatar() {
  const a = el("div", "avatar grad", LANGS[lang].tutor[0]);
  a.setAttribute("aria-hidden", "true");
  return a;
}

function tutorRow(stackChildren, showName) {
  const row = el("div", "row tutor");
  const stack = el("div", "stack");
  if (showName) stack.append(el("div", "who", LANGS[lang].tutor));
  stack.append(...stackChildren);
  row.append(avatar(), stack);
  return row;
}

function tutorNodes(text, key, streaming, showName) {
  const { vocab, body } = parse(text);
  const parts = [];
  const bubble = el("div", "bubble");
  if (body) paragraphs(bubble, body); else bubble.append(dots());
  parts.push(bubble);
  if (vocab.length) {
    const v = el("div", "vocab");
    vocab.forEach(item => {
      const [w, ...m] = item.split(/\s+[—–-]\s+/);
      const s = el("span"); s.append(el("b", null, w));
      if (m.length) s.append(" " + m.join(" – "));
      v.append(s);
    });
    parts.push(v);
  }
  if (!streaming && body) {
    const tr = translations[key];
    const tools = el("div", "tools");
    if (canSpeak) {
      const say = el("button", "link", "🔊 Listen");
      say.type = "button";
      say.onclick = () => speak(body.replace(/\*\*/g, ""));
      tools.append(say);
    }
    if (!(tr && tr.text) && sampleState === "ready") {
      const b = el("button", "link", tr && tr.loading ? "Translating…" : "EN  Translate");
      b.type = "button";
      b.disabled = !!(tr && tr.loading);
      b.onclick = () => translate(key, body);
      tools.append(b);
    }
    if (tools.childElementCount) parts.push(tools);
    if (tr && tr.text) parts.push(el("div", "translation", tr.text));
  }
  return [tutorRow(parts, showName)];
}

function welcomeNode() {
  const L = LANGS[lang], ex = L.example;
  const w = el("section", "welcome");

  const hero = el("div", "hero");
  const h1 = el("h1");
  h1.append(L.heroA, el("em", null, L.heroB));
  hero.append(h1);
  hero.append(el("p", null, `Chat with ${L.tutor}, your ${L.name} tutor. Every sentence you write comes back corrected in red pen, with a one-line reason, and the conversation keeps going.`));
  w.append(hero);

  const exBox = el("div", "card");
  exBox.append(el("div", "eyebrow", "Example"));
  const r1 = el("div", "row me"); r1.append(el("div", "bubble", ex.me));
  r1.append(correctionNode({ ok: false, fixed: ex.fixed, notes: ex.notes.map(t => ({ text: t })) }, false));
  exBox.append(r1);
  exBox.append(tutorRow([el("div", "bubble", ex.reply)], true));
  w.append(exBox);

  const pick = el("div", "card");
  pick.append(el("div", "eyebrow", "Pick a scene"));
  const chips = el("div", "chips");
  const chosen = store.get("tt:pick:" + lang, "free");
  SCENES.forEach(s => {
    const c = el("button", "chip");

    c.type = "button";
    c.setAttribute("aria-pressed", String(s.id === chosen));

    chips.append(c);
  });
  pick.append(chips);
  w.append(pick);

  const scene = SCENES.find(s => s.id === chosen) || SCENES[0];
  const start = el("button", "primary", sampleState === "absent" ? "Unavailable here" : `Start talking with ${L.tutor} →`);
  start.type = "button";
  start.disabled = busy || sampleState !== "ready";
  start.onclick = () => startChat({ label: scene.label, brief: scene.brief });
  w.append(start);
  if (sampleState === "absent") w.append(el("p", "hint", "This page talks to Claude through your Claude account. Open it in the Claude app or at claude.ai while signed in."));
  if (sampleState === "loading") w.append(el("p", "hint", "Connecting to Claude…"));
  w.append(el("p", "hint", "🎤 To speak, tap the microphone on your phone's keyboard. 🔊 Tap Listen under any reply to hear it aloud."));
  return w;
}

function startChat(scene) {
  scenes[lang] = scene; store.set("tt:scene:" + lang, scene);
  turns[lang] = []; store.set("tt:turns:" + lang, []);
  Object.keys(translations).forEach(k => { if (k.startsWith(lang + ":")) delete translations[k]; });
  view = "chat";
  send(LANGS[lang].greet, true);
}

function notebookNode() {
  const L = LANGS[lang];
  const mine = notebook.filter(m => m.lang === lang);
  const wrap = el("section", "notebook");
  const head = el("div", "nb-head");
  const back = el("button", "link", "← Back to chat");

  head.append(back);
  head.append(el("h1", null, `My ${L.name} mistakes`));
  head.append(el("p", null, mine.length
    ? `${mine.length} saved. Every correction from your chats lands here automatically.`
    : "Nothing yet. Every correction from your chats lands here automatically, so you can review it later."));
  if (mine.length && sampleState === "ready") {
    const drill = el("button", "primary", "Start a review drill");
    drill.type = "button";
    drill.disabled = busy;
    drill.onclick = () => startChat({ label: "Review drill", brief: reviewBrief(mine.slice(0, 8)) });
    head.append(drill);
    head.append(el("p", "hint", "The drill starts a new chat using your 8 most recent mistakes."));
  }
  wrap.append(head);
  mine.forEach(m => {
    const card = el("article", "nb-card");
    const meta = el("div", "nb-meta");
    meta.append(el("span", null, new Date(m.at).toLocaleDateString(undefined, { day: "numeric", month: "short" })));
    const del = el("button", "link", "Remove");
    del.type = "button";
    del.onclick = () => { notebook = notebook.filter(x => x !== m); store.set("tt:notebook", notebook); render(); };
    meta.append(del);
    card.append(meta);
    card.append(el("div", "nb-was", m.original));
    card.append(el("div", "fixed", m.fixed));
    if (m.notes.length) {
      const ul = el("ul");
      m.notes.forEach(n => ul.append(el("li", n.tip ? "tip" : "", n.text)));
      card.append(ul);
    }
    wrap.append(card);
  });
  return wrap;
}

// ---------- voice ----------
// Rank the device's voices so a natural-sounding female voice wins.
const FEMALE = {
  de: /anna|petra|helena|marlene|vicki|katja|hedda|amala|louisa|seraphina|tanja|ingrid|google deutsch/i,
  fr: /am[ée]lie|audrey|aur[ée]lie|marie|julie|hortense|denise|c[ée]line|l[ée]a|virginie|eloise|vivienne|brigitte|google fran[cç]ais/i
};
const MALE = /markus|yannick|martin|thomas|daniel|nicolas|henri|paul|stefan|conrad|killian|jacques|fred|eddy|reed|rocko|grandpa|klaus|hans|jonas|antoine|alain|remy|gerard|florian|ralf/i;
const NOVELTY = /eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|bells|bubbles|jester|organ|trinoids|whisper|zarvox|albert|bad news|boing|cellos|good news|superstar|wobble/i;

function scoreVoice(v) {
  let s = 0;
  if (/premium|enhanced|natural|neural|online|wavenet|studio/i.test(v.name)) s += 6;
  if (v.localService === false) s += 3;                       // cloud voices are usually the most natural
  if (FEMALE[lang].test(v.name)) s += 4;
  if (MALE.test(v.name)) s -= 6;
  if (NOVELTY.test(v.name)) s -= 10;
  if (/compact/i.test(v.name)) s -= 2;
  return s;
}

function voicesFor() {
  if (!canSpeak) return [];
  return window.speechSynthesis.getVoices()
    .filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(lang))
    .sort((a, b) => scoreVoice(b) - scoreVoice(a) || a.name.localeCompare(b.name));
}

function chosenVoice() {
  const list = voicesFor();
  const saved = store.get("tt:voice:" + lang, "");
  return list.find(v => v.voiceURI === saved) || list[0] || null;
}

const voicePrefs = { rate: store.get("tt:rate", 0.95), auto: store.get("tt:auto", false) };

function speak(text) {
  if (!canSpeak) return;
  try {
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "de" ? "de-DE" : "fr-FR";
    const voice = chosenVoice();
    if (voice) u.voice = voice;
    u.rate = voicePrefs.rate;
    u.pitch = 1.05;
    synth.speak(u);
  } catch {}
}

// iPhones only let a page speak after a tap; a silent utterance during the tap unlocks later auto-read.
function unlockSpeech() {
  if (!canSpeak || !voicePrefs.auto) return;
  try { const u = new SpeechSynthesisUtterance(""); u.volume = 0; window.speechSynthesis.speak(u); } catch {}
}

function renderVoicePanel() {
  const panel = $("voice-panel");
  if (panel.hidden) return;
  panel.replaceChildren();
  const inner = el("div", "panel-inner");
  const L = LANGS[lang];
  inner.append(el("div", "eyebrow", `${L.name} voice`));
  if (!canSpeak) {
    inner.append(el("p", "hint", "This browser can't read text aloud."));
    panel.append(inner); return;
  }
  const list = voicesFor();
  if (!list.length) {
    inner.append(el("p", "hint", `No ${L.name} voice is installed on this device yet. See the tip below to add one.`));
  } else {
    const row = el("div", "panel-row");
    const sel = el("select"); sel.id = "voice-select"; sel.setAttribute("aria-label", "Voice");
    const current = chosenVoice();
    list.forEach((v, i) => {
      const o = el("option", null, v.name + (i === 0 ? "  ★ best match" : ""));
      o.value = v.voiceURI; if (current && v.voiceURI === current.voiceURI) o.selected = true;
      sel.append(o);
    });
    sel.onchange = () => store.set("tt:voice:" + lang, sel.value);
    const test = el("button", "ghost", "▶ Test"); test.type = "button";
    test.onclick = () => speak(lang === "de" ? "Hallo! Schön, dass du da bist. Wollen wir ein bisschen plaudern?" : "Bonjour ! Je suis ravie de te parler. On discute un peu ?");
    row.append(sel, test);
    inner.append(row);
  }
  const rateRow = el("label", "panel-row");
  rateRow.append(el("span", null, "Speed"));
  const rate = el("input"); rate.type = "range"; rate.id = "voice-rate"; rate.min = "0.7"; rate.max = "1.15"; rate.step = "0.05"; rate.value = String(voicePrefs.rate);
  rate.oninput = () => { voicePrefs.rate = Number(rate.value); store.set("tt:rate", voicePrefs.rate); };
  rateRow.append(rate);
  inner.append(rateRow);
  const autoRow = el("label", "panel-row");
  const auto = el("input"); auto.type = "checkbox"; auto.id = "voice-auto"; auto.checked = voicePrefs.auto;
  auto.onchange = () => { voicePrefs.auto = auto.checked; store.set("tt:auto", auto.checked); };
  autoRow.append(auto, el("span", null, "Read every reply aloud automatically"));
  inner.append(autoRow);
  const tip = el("p", "hint");
  tip.textContent = lang === "de"
    ? "Sounds robotic? Your phone has free natural voices. iPhone: Settings → Accessibility → Spoken Content → Voices → German, download a female voice marked Enhanced or Premium (e.g. Anna or Petra). Android: Settings → Google Text-to-speech → German, install the voice data and pick a female voice. Then reopen this page."
    : "Sounds robotic? Your phone has free natural voices. iPhone: Settings → Accessibility → Spoken Content → Voices → French, download a female voice marked Enhanced or Premium (e.g. Amélie or Audrey). Android: Settings → Google Text-to-speech → French, install the voice data and pick a female voice. Then reopen this page.";
  inner.append(tip);
  panel.append(inner);
}
if (canSpeak) window.speechSynthesis.addEventListener?.("voiceschanged", () => renderVoicePanel());

function render() {
  const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
  const T = turns[lang];
  log.replaceChildren();
  renderControls();
  if (view === "notebook") { log.append(notebookNode()); return; }
  const all = pending !== null ? [...T, { role: "assistant", content: pending, streaming: true }] : T;

  if (all.length === 0) log.append(welcomeNode());
  else log.append(el("div", "scene", "Scene: " + scenes[lang].label));

  // Index of the last assistant reply with a real correction, for the "Explain" link
  let latestFix = -1;
  all.forEach((t, i) => { if (t.role === "assistant" && !t.streaming) { const f = parse(t.content).fix; if (f && !f.ok) latestFix = i; } });
  if (pending !== null) latestFix = -1;

  all.forEach((t, i) => {
    if (t.role === "user") {
      if (i === 0) return;                                   // the hidden opening greeting
      const row = el("div", "row me");
      if (t.content === "/explain") row.append(el("div", "bubble meta", "Explain that correction, please"));
      else row.append(el("div", "bubble", t.content));
      const next = all[i + 1];
      if (next && next.role === "assistant" && next.content !== "/explain" && t.content !== "/explain") {
        const { fix } = parse(next.content);
        if (fix) row.append(correctionNode(fix, i + 1 === latestFix));
      }
      log.append(row);
    } else {
      log.append(...tutorNodes(t.content, lang + ":" + i, !!t.streaming, i <= 1));
    }
  });

  if (errorMsg) log.append(el("div", "error", errorMsg));
  if (all.length && (nearBottom || pending !== null)) scroller.scrollTop = scroller.scrollHeight;
  renderControls();
}

function renderControls() {
  const L = LANGS[lang];
  document.documentElement.dataset.lang = lang;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const count = notebook.filter(m => m.lang === lang).length;
  $("nb").classList.toggle("on", view === "notebook");
  $("nb").setAttribute("aria-label", view === "notebook" ? "Back to chat" : `Mistake notebook, ${count} saved`);
  $("nb-count").hidden = !count;
  $("nb-count").textContent = count > 99 ? "99+" : String(count);
  $("composer").hidden = view === "notebook" || (turns[lang].length === 0 && pending === null);
  if ($("voice-panel").dataset.lang !== lang) { $("voice-panel").dataset.lang = lang; renderVoicePanel(); }
  input.placeholder = L.placeholder;
  const keys = $("keys");
  if (keys.dataset.lang !== lang) {
    keys.dataset.lang = lang;
    keys.replaceChildren(...L.keys.map(k => {
      const b = el("button", null, k); b.type = "button"; b.tabIndex = -1;
      b.onmousedown = (e) => e.preventDefault();              // keep the keyboard open
      b.onclick = () => insertChar(k);
      return b;
    }));
  }
  const started = turns[lang].length > 0;
  input.disabled = !started || sampleState !== "ready";
  if (busy) {
    sendBtn.classList.add("stop"); sendBtn.disabled = false; sendBtn.setAttribute("aria-label", "Stop");
    sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  } else {
    sendBtn.classList.remove("stop"); sendBtn.setAttribute("aria-label", "Send");
    sendBtn.disabled = !started || sampleState !== "ready" || !input.value.trim();
    sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  }
}

function insertChar(ch) {
  const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
  input.value = input.value.slice(0, s) + ch + input.value.slice(e);
  input.focus();
  input.setSelectionRange(s + ch.length, s + ch.length);
  autosize(); renderControls();
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }

// ---------- talking to Claude ----------
const ERRORS = {
  not_granted: "Claude access wasn't allowed for this page. Reload the page to be asked again.",
  sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "You've hit a usage limit. Wait a little, then send again.",
  session_expired: "Your Claude session expired. Sign in again, then resend.",
  refused: "Claude couldn't answer that message. Try saying it differently.",
  empty_completion: "The tutor didn't reply. Try sending again.",
  prompt_too_large: "The conversation got too long. Tap New chat to start fresh."
};

async function send(content, opening = false) {
  if (busy || !sample) return;
  const L = LANGS[lang], T = turns[lang], myLang = lang;
  errorMsg = "";
  T.push({ role: "user", content });
  busy = true; pending = ""; ctl = new AbortController();
  unlockSpeech();
  render();
  const history = T.slice(-MAX_TURNS);
  try {
    const { text } = await sample([{ role: "user", content: rules(L, $("level").value, scenes[myLang].brief) }, ...history], {
      cache: false,
      signal: ctl.signal,
      onText: ({ text }) => { if (lang === myLang) { pending = text; render(); } }
    });
    T.push({ role: "assistant", content: text });
    if (voicePrefs.auto && lang === myLang) speak(parse(text).body.replace(/\*\*/g, ""));
    store.set("tt:turns:" + myLang, T);
    const { fix } = parse(text);
    if (!opening && content !== "/explain" && fix && !fix.ok && fix.fixed) {
      notebook.unshift({ lang: myLang, original: content, fixed: fix.fixed, notes: fix.notes, at: Date.now() });
      notebook = notebook.slice(0, MAX_NOTEBOOK);
      store.set("tt:notebook", notebook);
    }
  } catch (e) {
    T.pop();                                                   // take the message back so it can be resent
    if (!opening && content !== "/explain" && !input.value) input.value = content;
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) sampleState = "absent";
    if (!(e && e.code === "cancelled")) errorMsg = ERRORS[e && e.code] || "The connection dropped before the tutor finished. Send again.";
  } finally {
    busy = false; pending = null; ctl = null;
    if (lang === myLang) render(); else renderControls();
    autosize();
  }
}

async function translate(key, body) {
  if (!sample) return;
  translations[key] = { loading: true }; render();
  try {
    const { text } = await sample(`Translate this ${LANGS[lang].name} text into natural English. Reply with only the translation.\n\n${body}`, { modelTier: "quick" });
    translations[key] = { text };
  } catch (e) {
    delete translations[key];
    if (!(e && e.code === "cancelled")) errorMsg = ERRORS[e && e.code] || "Couldn't translate that. Try again.";
  }
  render();
}

// ---------- events ----------
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy) { ctl?.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; autosize();
  send(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer: fine)").matches) {
    e.preventDefault(); $("composer").requestSubmit();
  }
});
input.addEventListener("input", () => { autosize(); renderControls(); });

$("voice").addEventListener("click", () => {
  const panel = $("voice-panel");
  panel.hidden = !panel.hidden;
  $("voice").setAttribute("aria-expanded", String(!panel.hidden));
  renderVoicePanel();
});

$("nb").addEventListener("click", () => {
  view = view === "notebook" ? "chat" : "notebook";
  render();
  scroller.scrollTop = view === "notebook" ? 0 : scroller.scrollHeight;
});

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  if (busy || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set("tt:lang", lang); errorMsg = "";
  render();
}));
$("level").addEventListener("change", () => store.set("tt:level", $("level").value));

let armTimer = null;
$("reset").addEventListener("click", (e) => {
  const btn = e.currentTarget;
  if (busy) return;
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed"); $("reset-note").hidden = false;
    armTimer = setTimeout(() => { btn.classList.remove("armed"); $("reset-note").hidden = true; }, 3000);
    return;
  }
  clearTimeout(armTimer);
  btn.classList.remove("armed"); $("reset-note").hidden = true;
  turns[lang] = []; store.set("tt:turns:" + lang, []); errorMsg = ""; view = "chat";
  Object.keys(translations).forEach(k => { if (k.startsWith(lang + ":")) delete translations[k]; });
  render();
});

render();
(async () => {
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
  sampleState = sample ? "ready" : "absent";
  render();
})();
</script>
